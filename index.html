<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일본어교과교재연구및지도법</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 떠다니는 벚꽃잎 -->
  <div class="petals" aria-hidden="true"></div>

  <!-- 따라오는 헤더 -->
  <header class="header" id="top">
    <div class="header__inner">
      <a href="#home" class="brand">
        <span class="brand__mark">桜</span>
        <span class="brand__text">
          <strong id="brand-title"></strong>
          <small id="brand-sub"></small>
        </span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="header__tools">
        <button class="admin-btn" aria-label="관리자 모드" title="관리자 모드">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 8V7a3 3 0 1 1 6 0v3H9Zm3 4a2 2 0 0 1 1 3.73V19h-2v-1.27A2 2 0 0 1 12 14Z"/></svg>
        </button>
        <button class="menu-toggle" aria-label="메뉴 열기" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" id="home"></section>
    <section class="notice-wrap" id="notice" hidden></section>
    <section class="stats-wrap" id="stats"></section>
    <section class="section" id="about"></section>
    <section class="section section--tint" id="poll"></section>
    <section class="section" id="curriculum"></section>
    <section class="section section--tint" id="materials"></section>
    <section class="section" id="portfolio"></section>
    <section class="section section--tint" id="myclass"></section>
    <section class="section" id="enroll"></section>
    <section class="section section--tint" id="apply"></section>
    <section class="section" id="tools"></section>
    <section class="section section--tint" id="prepare"></section>
    <section class="section" id="faq"></section>
    <section class="section section--tint" id="infographic"></section>
  </main>

  <!-- 교수자 소개 푸터 -->
  <footer class="footer" id="instructor"></footer>

  <!-- 맨 위로 버튼 -->
  <button class="to-top" aria-label="맨 위로">↑</button>

  <!-- 설정 파일 → 렌더링 스크립트 순서 유지 -->
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="participate.js"></script>
  <script src="admin.js"></script>
</body>
</html>
